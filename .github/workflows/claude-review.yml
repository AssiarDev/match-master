name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.js"
      - "**.ts"
      - "**.jsx"
      - "**.tsx"
      - "**.json"
      - "**.mjs"
      - "**.cjs"

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    # Ne pas tourner sur les PRs en draft
    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Tu es un expert JavaScript/TypeScript senior.
            Effectue une review complète de cette PR en français.

            Analyse les points suivants :
            1. 🐛 Bugs potentiels et erreurs logiques
            2. 🔒 Problèmes de sécurité (injections, XSS, exposition de données sensibles)
            3. ⚡ Performances (boucles inutiles, re-renders, appels API excessifs)
            4. 🧹 Qualité du code (lisibilité, nommage, complexité)
            5. 🧪 Couverture de tests manquante sur les parties critiques

            Format de réponse :
            - Commence par un résumé en 2-3 lignes de la PR
            - Utilise des emojis pour chaque catégorie de problème
            - Pour chaque problème, indique le fichier et la ligne concernée
            - Classe les problèmes par sévérité : 🔴 Critique / 🟡 Attention / 🟢 Suggestion
            - Termine par une conclusion : ✅ Approuvé / ⚠️ Corrections requises