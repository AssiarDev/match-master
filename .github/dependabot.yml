version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Gel des versions majeures jusqu'au passage RNCP (sept. 2026).
    # A retirer ensuite pour migrer vers Prisma 7 et TypeScript 7.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Depuis la 1.16.12, @swc/core refuse de charger son binaire natif sous
      # Windows quand un autre compte peut modifier le dossier de cache
      # (droit hérité du profil utilisateur), ce qui empêche Jest de démarrer
      # en local. A retirer quand une version de swc corrigera ce comportement.
      - dependency-name: "@swc/core"
        versions: [">=1.16.12"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-all:
        patterns:
          - "*"
