from_latest_tag = true
ignore_merge_commits = true

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "match-master"
owner = "AssiarDev"

[git_hooks.pre-commit]
script = """#!/bin/sh
npm --prefix server run typecheck && npm --prefix server run prettier:check && typos
"""

[git_hooks.commit-msg]
script = """#!/bin/sh
cog verify --file $1
"""

[commit_types]
feat     = { changelog_title = "Features" }
fix      = { changelog_title = "Bug Fixes" }
docs     = { changelog_title = "Documentation" }
doc      = { changelog_title = "Documentation" }
chore    = { changelog_title = "Chores" }
refactor = { changelog_title = "Refactoring" }
test     = { changelog_title = "Tests" }
perf     = { changelog_title = "Performance" }
ci     = { changelog_title = "Continuous Integration" }